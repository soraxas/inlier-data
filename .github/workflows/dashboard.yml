name: Dashboard

# The page loads live registry and release data in the browser; rebuilding
# only refreshes its embedded offline snapshot.
on:
  push:
    branches: [main]
    paths:
      - inlier_data/*.json
      - scripts/build_dashboard.py
      - .github/workflows/dashboard.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv run --no-project python scripts/build_dashboard.py
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
