[project]
name = "inlier-data"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "pooch>=1.6.0",
]

[tool.setuptools.packages.find]
include = ["inlier_data"]

[tool.setuptools.package-data]
inlier_data = ["release_artifacts.json", "gaussian_splats.json"]

[tool.ruff.lint]
# Pin the rule set here so local global ruff configs do not change results.
select = ["E", "F", "W", "I", "B", "UP"]
# Line length is the formatter's job; registry hash lines cannot wrap.
ignore = ["E501"]
